# ============================================================
# Project: DHCP / DNS Anomaly Detection
# ============================================================

# ------------------------------------------------------------
# Session
# ------------------------------------------------------------

[[session]]
name = "dhcp-dns-anomaly"
path = "~/GitHub/dns-abnormal-detection"
alias = "dhcp"
startup_command = "tmux kill-window && tmux select-window -t :1"
windows = [
  "dhcp-nvim",
  "dhcp-shell",
  "dhcp-git",
]


# ------------------------------------------------------------
# Windows
# ------------------------------------------------------------

[[window]]
name = "dhcp-nvim"
path = "~/GitHub/dns-abnormal-detection"
startup_script = "source .venv/bin/activate && nvim"

[[window]]
name = "dhcp-shell"
path = "~/GitHub/dns-abnormal-detection"
startup_script = "source .venv/bin/activate"

[[window]]
name = "dhcp-git"
path = "~/GitHub/dns-abnormal-detection"
startup_script = "lazygit"



# ============================================================
# Project: Dotfiles
# ============================================================

# ------------------------------------------------------------
# Session
# ------------------------------------------------------------

[[session]]
name = "dotfiles"
path = "~/.local/share/chezmoi"
alias = "dot"
windows = [
  "dot-nvim",
  "dot-git",
  "dot-shell",
]


# ------------------------------------------------------------
# Windows
# ------------------------------------------------------------

[[window]]
name = "dot-nvim"
path = "~/.local/share/chezmoi"
startup_script = "nvim"

[[window]]
name = "dot-git"
path = "~/.local/share/chezmoi"
startup_script = "lazygit"

[[window]]
name = "dot-shell"
path = "~/.local/share/chezmoi"
