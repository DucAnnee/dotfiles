# ============================================================
# Global
# ============================================================

[tui]
preview = true


# ============================================================
# Project: Podi
# ============================================================

# ------------------------------------------------------------
# Session
# ------------------------------------------------------------

[[session]]
name = "podi"
path = "~/GitHub/podi"
alias = "podi"
startup_command = "tmux kill-window && tmux select-window -t :1"
windows = [
  "mgmt-nvim",
  "mgmt-dev",
  "mgmt-ai",

  "booth-nvim",
  "booth-dev",
  "booth-ai",

  "core-nvim",
  "core-ai",
]


# ------------------------------------------------------------
# Management Website
# ------------------------------------------------------------

[[window]]
name = "mgmt-nvim"
path = "~/GitHub/podi/management-website"
startup_script = "nvim"

[[window]]
name = "mgmt-dev"
path = "~/GitHub/podi/management-website"

[[window]]
name = "mgmt-ai"
path = "~/GitHub/podi/management-website"
startup_script = "codex resume --last"


# ------------------------------------------------------------
# Booth
# ------------------------------------------------------------

[[window]]
name = "booth-nvim"
path = "~/GitHub/podi/booth-app"
startup_script = "nvim"

[[window]]
name = "booth-dev"
path = "~/GitHub/podi/booth-app"

[[window]]
name = "booth-ai"
path = "~/GitHub/podi/booth-app"
startup_script = "codex resume --last"


# ------------------------------------------------------------
# Core
# ------------------------------------------------------------

[[window]]
name = "core-nvim"
path = "~/GitHub/podi/podi-core"
startup_script = "nvim"

[[window]]
name = "core-ai"
path = "~/GitHub/podi/podi-core"
startup_script = "codex resume --last"



