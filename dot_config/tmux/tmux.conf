# ==========================================
# Terminal / colors
# ==========================================

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"


# ==========================================
# Prefix key
# ==========================================

# Remove the annoying default Ctrl-b prefix
unbind C-b

# Use Ctrl-Space as the main prefix
set -g prefix C-Space
bind C-Space send-prefix

# Optional second prefix
# NOTE: Ctrl-s may freeze some terminals unless flow control is disabled.
# If Ctrl-s freezes your terminal, run: stty -ixon
set -g prefix2 C-s


# ==========================================
# Basic behavior
# ==========================================

# Start window and pane numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Automatically renumber windows after closing one
set -g renumber-windows on

# Enable mouse support
set -g mouse on

# Increase scrollback history
set -g history-limit 100000

# Faster escape timing, better for Neovim
set -sg escape-time 10


# ==========================================
# Windows and panes
# ==========================================

# Split panes using intuitive keys
unbind %
unbind '"'

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# New window starts in current pane path
bind c new-window -c "#{pane_current_path}"

# Close pane/window with confirmation
bind x kill-pane
bind X kill-window


# ==========================================
# Vim-style navigation
# ==========================================

# Vi mode in copy mode
setw -g mode-keys vi

# Move between panes without prefix: Ctrl-h/j/k/l
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

# Resize panes with prefix + H/J/K/L
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Move between windows with prefix + Ctrl-h / Ctrl-l
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+


# ==========================================
# Copy mode
# ==========================================

bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel
bind-key -T copy-mode-vi r send -X rectangle-toggle


# ==========================================
# Reload config
# ==========================================

unbind r
bind r source-file ~/.tmux.conf \; display-message "Reloaded ~/.tmux.conf"


# ==========================================
# Plugins
# ==========================================

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'dracula/tmux'

# Dracula theme options, optional
set -g @dracula-show-powerline true
set -g @dracula-show-left-icon session
set -g @dracula-plugins "cpu-usage ram-usage time"
set -g @dracula-military-time true

# Initialize TMUX plugin manager.
# Keep this line at the very bottom of tmux.conf.
run '~/.tmux/plugins/tpm/tpm'

